name: Build

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE_NAME: planning-mfe
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME || 'local' }}

jobs:
  build-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

      - name: Generate image tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          image_tag="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger production deploy
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.CERXOS_DEPLOY_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CERXOS_DEPLOY_DISPATCH_TOKEN is not set; skipping auto deploy of planning-mfe $IMAGE_TAG."
            exit 0
          fi

          # Call the dispatch API directly: `gh workflow run` without a ref looks up the
          # default branch, which this Actions-only token is not allowed to read.
          gh api --method POST \
            repos/nurakmaljalil91/CerxosWebSystem/actions/workflows/deploy-cerxos-service.yml/dispatches \
            -f ref=main \
            -f "inputs[environment]=production" \
            -f "inputs[server]=production" \
            -f "inputs[service]=planning-mfe" \
            -f "inputs[image_tag]=$IMAGE_TAG"
